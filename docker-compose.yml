services:
  # --- MySQL Source (Master) ---
  db-source:
    image: mysql:8.0
    container_name: mysql-source
    hostname: db-source
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: pwpw
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid_mode=ON
      - --enforce-gtid-consistency=ON
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./sql/01_init_master.sql:/docker-entrypoint-initdb.d/01_init_master.sql
    networks:
      - card-net

  # --- MySQL Replica 1 ---
  db-replica-1:
    image: mysql:8.0
    container_name: mysql-replica-1
    hostname: db-replica-1
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: pwpw
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --gtid_mode=ON
      - --enforce-gtid-consistency=ON
      - --read-only=1
      - --default-authentication-plugin=mysql_native_password # <- 추가됨!
    volumes:
      - ./sql/02_init_replica.sql:/docker-entrypoint-initdb.d/02_init_replica.sql

    networks:
      - card-net
    depends_on:
      - db-source

  # --- MySQL Replica 2 ---
  db-replica-2:
    image: mysql:8.0
    container_name: mysql-replica-2
    hostname: db-replica-2
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: pwpw
    command:
      - --server-id=3
      - --log-bin=mysql-bin
      - --gtid_mode=ON
      - --enforce-gtid-consistency=ON
      - --read-only=1
      - --default-authentication-plugin=mysql_native_password # <- 추가됨!
    volumes:
      - ./sql/02_init_replica.sql:/docker-entrypoint-initdb.d/02_init_replica.sql
    networks:
      - card-net
    depends_on:
      - db-source

  # --- Redis ---
  redis:
    image: redis:7.2-alpine
    container_name: card-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - card-net

  # --- Orchestrator ---
  orchestrator:
    image: openarkcode/orchestrator:latest
    container_name: orchestrator
    ports:
      - "3000:3000"
    volumes:
      - ./orchestrator.conf.json:/etc/orchestrator.conf.json
    networks:
      - card-net
    depends_on:
      - db-source

 # --- ProxySQL ---
  proxysql:
    image: proxysql/proxysql:2.5.5
    container_name: card-proxysql
    hostname: proxysql
    ports:
      - "6032:6032" # 관리자 세팅용 포트
      - "6033:6033" # WAS(애플리케이션) 접속용 포트
    volumes:
      - ./proxysql/data:/var/lib/proxysql
    networks:
      - card-net
    depends_on:
      - db-source
      - db-replica-1
      - db-replica-2
 
 # --- ProxySQL 자동 세팅용 일회성 컨테이너 ---
  proxysql-setup:
    image: mysql:8.0
    container_name: proxysql-setup
    volumes:
      - ./sql/proxysql_setup.sql:/proxysql_setup.sql
    networks:
      - card-net
    depends_on:
      - proxysql
    command: >
      bash -c "
        echo 'Waiting for ProxySQL to start...';
        while ! mysqladmin ping -h proxysql -P 6032 -u admin -padmin --silent; do
          sleep 2;
        done;
        echo 'ProxySQL is up! Running setup script...';
        mysql -u admin -padmin -h proxysql -P 6032 < /proxysql_setup.sql;
        echo 'ProxySQL Setup Completed!';
      "

networks:
  card-net:
    driver: bridge
